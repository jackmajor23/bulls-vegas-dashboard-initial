name: Update Dashboard Data

# ── Triggers ─────────────────────────────────────────────────────────────────
on:
  schedule:
    # Runs at 07:00 and 19:00 UTC every day
    - cron: '0 7,19 * * *'
  workflow_dispatch:   # Allows manual run from GitHub Actions tab

# ── Job ──────────────────────────────────────────────────────────────────────
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to push data.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install \
            google-analytics-data \
            google-api-python-client \
            google-auth \
            requests

      - name: Run data fetch script
        env:
          GA4_PROPERTY_ID:             ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY:             ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_VIDEO_ID:            ${{ secrets.YOUTUBE_VIDEO_ID }}
          WP_BASE_URL:                 ${{ secrets.WP_BASE_URL }}
          WP_USERNAME:                 ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:             ${{ secrets.WP_APP_PASSWORD }}
          META_ACCESS_TOKEN:           ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID:                ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID:             ${{ secrets.META_IG_USER_ID }}
        run: python scripts/fetch_data.py

      - name: Commit and push updated data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data.json
          # Only commit if data.json actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update dashboard data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
